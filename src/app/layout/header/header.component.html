<header class="header">

  <div class="header-container">

    <!-- LOGO -->
    <a routerLink="/home" class="logo">
      <span class="rg">RG</span>
      <span class="name">Construction</span>
    </a>

    <!-- NAVIGATION -->
    <nav class="nav" [class.active]="menuOpen">

      <a [routerLink]="['/home']" fragment="home" (click)="closeMenu()">Home</a>

      <a [routerLink]="['/home']" fragment="about" (click)="closeMenu()">About</a>

      <a [routerLink]="['/home']" fragment="services" (click)="closeMenu()">Services</a>

      <a [routerLink]="['/home']" fragment="projects" (click)="closeMenu()">Projects</a>

      <a [routerLink]="['/home']" fragment="contact" (click)="closeMenu()">Contact</a>

      <a *ngIf="isAdmin$ | async" routerLink="/admin" (click)="closeMenu()" class="admin-link">Dashboard</a>
      <a *ngIf="user$ | async" (click)="logout()" class="logout-link">Logout</a>

    </nav>

    <!-- ACTION BUTTONS -->
    <div class="header-actions">

      <!-- AUTH STATE MOBILE (Optional login link if not logged in) -->
      <a *ngIf="!(user$ | async)" routerLink="/login" class="login-btn">Login</a>

      <!-- CALL -->
      <a href="tel:+919822069294" class="call-btn">
        📞
        <span>Call</span>
      </a>

      <!-- WHATSAPP -->
      <a
        href="https://wa.me/919822069294"
        target="_blank"
        class="whatsapp-btn"
      >
        💬
      </a>

    </div>

    <!-- HAMBURGER -->
    <div class="hamburger" (click)="toggleMenu()">

      <span></span>
      <span></span>
      <span></span>

    </div>

  </div>

  <!-- MOBILE OVERLAY -->
  <div
  class="overlay"
  *ngIf="menuOpen"
  (click)="closeMenu()">
  </div>

</header>
